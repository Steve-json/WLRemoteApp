plugins {
    id 'com.android.application'
}

android {
    namespace 'com.remoteapp.windesktop'
    compileSdk 30

    defaultConfig {
        applicationId "com.remoteapp.windesktop"
        minSdk 24
        targetSdk 30
        versionCode 2
        versionName "2.0.0"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
